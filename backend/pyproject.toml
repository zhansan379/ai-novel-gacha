[project]
name = "ai-novel-gacha"
version = "0.1.0"
description = "AI 抽卡互动小说生成系统 - 后端 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "chromadb>=1.5.9",
]

# 公网部署建议安装 secure 组：加密落库模型 API Key（需设置 SECRET_KEY）。
# 本地/可信内网不安装也不影响跑（回退明文存储）。
[project.optional-dependencies]
secure = ["cryptography>=42"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
